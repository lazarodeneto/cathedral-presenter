name: Desktop validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run desktop:build
      - if: runner.os == 'macOS'
        run: node desktop/package.cjs --mac --arm64 --dir --config.mac.notarize=false
      - if: runner.os == 'Windows'
        run: node desktop/package.cjs --win --x64 --dir --config.win.signAndEditExecutable=false
      - run: node desktop/verify-package.cjs
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'release/mac-arm64/Cathedral Presenter.app' release/Cathedral-Presenter-macOS-arm64-unsigned.zip
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath 'release/Cathedral-Presenter-Windows-x64-unsigned.zip'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cathedral-Presenter-${{ runner.os }}-unsigned
          path: release/*.zip
          retention-days: 7
