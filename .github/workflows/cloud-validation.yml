name: Cloud validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cathedral_test
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: cathedral_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CATHEDRAL_TEST_DATABASE_URL: postgresql://cathedral_test:integration-test-only@127.0.0.1:5432/cathedral_test
      VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:translations
      - run: npm test -- --maxWorkers=2
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_CATHEDRAL_MODE: cloud
      - run: npm run worker:build
